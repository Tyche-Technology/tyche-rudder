services:
  rudder:
    image: ${RUDDER_IMAGE:?RUDDER_IMAGE must be set}
    pull_policy: never
    container_name: rudder
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://rudder:${DB_PASSWORD}@cloud-sql-proxy:5432/rudder
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - APP_BASE_URL=${APP_BASE_URL}
      - GCS_BUCKET=${GCS_BUCKET}
    depends_on: [cloud-sql-proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.24.1@sha256:10baeffb98e5a0318b03891049c63aec08ecd99b7aae944227d69bc9d0bbf1e6
    container_name: cloud-sql-proxy
    restart: unless-stopped
    command: ["--address", "0.0.0.0", "--port", "5432", "${CLOUD_SQL_INSTANCE:?CLOUD_SQL_INSTANCE must be set}"]
