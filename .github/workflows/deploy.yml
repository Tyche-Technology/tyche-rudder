name: Deploy to GCP VM

on:
  push:
    branches:
      - master
    # Explicit allowlist (not paths-ignore) — same reasoning as the dashboard's
    # deploy.yml: update this list when a new root-level build input is added.
    paths:
      - "src/**"
      - "drizzle/**"
      - "scripts/**"
      - "deploy/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# 같은 대상(VM)에 대한 배포가 겹치지 않도록 직렬화한다.
# cancel-in-progress: false — 진행 중 배포를 중단하면 VM이 중간 상태에 남는다.
concurrency:
  group: deploy-rudder
  cancel-in-progress: false

# 기본은 최소 권한. 쓰기가 필요한 잡(build)만 개별적으로 올린다.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Coverage gate
        run: npm run coverage:gate

  build:
    name: Build & Push Image
    needs: test
    # codex branch-review 패턴: workflow_dispatch는 어떤 브랜치든 겨냥할 수 있다.
    # 이 가드가 없으면 그 브랜치 코드가 prod 시크릿과 함께 VM에 배포되어 master
    # 리뷰를 우회한다. push는 이미 master 한정이지만, 수동 dispatch도 막는다.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # deploy 잡이 mutable 태그 대신 이 digest로 정확한 이미지를 pull한다
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    # build는 이미 게이트되어 있고 deploy는 그걸 필요로 하지만, 이 가드는
    # 나중에 needs가 바뀌더라도 방어선이 되도록 명시적으로 둔다.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # build 잡이 방금 push한 immutable digest — latest 같은 mutable 태그는
      # 레이스(구 커밋이 나중에 덮어씀)에 취약하므로 사용하지 않는다
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_REPO: ghcr.io/${{ github.repository }}
      CLOUD_SQL_INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCE }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        env:
          VM_SSH_KEY_BASE64: ${{ secrets.VM_SSH_KEY_BASE64 }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$VM_SSH_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "Host *" "  StrictHostKeyChecking yes" "  UserKnownHostsFile ~/.ssh/known_hosts" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Free VM disk space
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'CLEANUP_SCRIPT'
            set -euo pipefail

            echo "Disk before cleanup:"
            df -h / "$HOME" || true

            # NOTE: docker system prune은 배포 성공 후로 이동했다 — 여기서 이미지를
            # 지우면 헬스 체크 실패 시 롤백할 이전 이미지가 사라진다.
            echo "Pruning Docker build cache only (images are kept for rollback)..."
            docker builder prune -af || true

            echo "Disk after cleanup:"
            df -h / "$HOME" || true
          CLEANUP_SCRIPT

      - name: Docker login on VM (GHCR)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN은 stdin으로 전달하고 배포 종료 시 always 단계에서 logout한다.
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Copy docker-compose.prod.yml to VM
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} "mkdir -p ~/rudder"
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}:~/rudder/

      - name: Deploy to VM via SSH
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
            "IMAGE_DIGEST='${IMAGE_DIGEST}' IMAGE_REPO='${IMAGE_REPO}' CLOUD_SQL_INSTANCE='${CLOUD_SQL_INSTANCE}' SLACK_CHANNEL_ID='${SLACK_CHANNEL_ID}' bash -s" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            echo "=========================================="
            echo "Deployment started at $(date)"
            echo "=========================================="

            DEPLOY_DIR=~/rudder
            COMPOSE_FILE=docker-compose.prod.yml
            NEW_IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
            LATEST_TAG="${IMAGE_REPO}:latest"
            ROLLBACK_TAG="${IMAGE_REPO}:rollback"
            export RUDDER_IMAGE="$LATEST_TAG"
            export CLOUD_SQL_INSTANCE SLACK_CHANNEL_ID

            if [ -z "${IMAGE_DIGEST}" ]; then
              echo "ERROR: IMAGE_DIGEST is empty — refusing to deploy a mutable tag"
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "[1/6] Tagging current image as rollback fallback..."
            CURRENT_IMAGE=$(docker inspect --format '{{.Image}}' rudder 2>/dev/null || true)
            if [ -n "$CURRENT_IMAGE" ] && docker image inspect "$CURRENT_IMAGE" >/dev/null 2>&1; then
              docker tag "$CURRENT_IMAGE" "$ROLLBACK_TAG"
              echo "  Fallback: $ROLLBACK_TAG"
            else
              echo "  No previous image (first deploy) — rollback unavailable"
            fi

            echo "[2/6] Pulling image by digest: $NEW_IMAGE"
            docker pull "$NEW_IMAGE"
            docker tag "$NEW_IMAGE" "$LATEST_TAG"

            echo "[3/6] Running migrations against the NEW image (old container still serving)..."
            # `depends_on` only waits for the cloud-sql-proxy container's process
            # to start, not for its upstream Cloud SQL connection to be ready —
            # a fresh/just-recreated proxy can refuse the first connection for a
            # second or two. Verified locally: an immediate `run` raced a cold
            # proxy and failed with ECONNREFUSED, then succeeded on retry once
            # the proxy had settled. Retry a few times before treating it as a
            # real migration failure.
            MIGRATE_OK=0
            for i in 1 2 3 4 5; do
              # The deploy script itself arrives over stdin, so detach the migration too.
              if docker compose -f "$COMPOSE_FILE" run --rm -T rudder node scripts/migrate.mjs < /dev/null; then
                MIGRATE_OK=1
                break
              fi
              echo "  Migration attempt $i/5 failed, retrying in 3s..."
              sleep 3
            done

            if [ "$MIGRATE_OK" -ne 1 ]; then
              echo ""
              echo "=========================================="
              echo "MIGRATION FAILED — aborting before container swap."
              echo "The previous container (if any) is untouched and keeps serving."
              echo "=========================================="
              exit 1
            fi

            echo "[4/6] Restarting container..."
            docker compose -f "$COMPOSE_FILE" down --remove-orphans 2>/dev/null || true
            # Guarded, not a bare call: under `set -e` a failure here (compose
            # syntax error, port conflict, daemon hiccup) would abort the whole
            # script right here — after `down` already stopped the old
            # container, before the rollback logic below ever runs. Route it
            # into the same rollback path as a health-check failure instead.
            UP_OK=1
            docker compose -f "$COMPOSE_FILE" up -d || UP_OK=0

            echo "[5/6] Waiting for health check (up to 120s; compose start_period is 40s)..."
            HEALTHY=0
            if [ "$UP_OK" -eq 1 ]; then
              for i in {1..24}; do
                sleep 5
                if wget -q --spider http://127.0.0.1:3000/api/health 2>/dev/null; then
                  HEALTHY=1
                  break
                fi
                echo "  Attempt $i/24..."
              done
            else
              echo "  docker compose up -d failed outright — skipping the wait, going straight to rollback."
            fi

            if [ "$HEALTHY" -eq 1 ]; then
              echo ""
              echo "=========================================="
              echo "Deployment successful!"
              echo "=========================================="
              docker compose -f "$COMPOSE_FILE" ps
              # 성공 확인 후에만 prune — :rollback 태그 이미지는 태그가 있어 살아남는다
              echo "[6/6] Pruning unused Docker data (rollback image is tagged and kept)..."
              docker system prune -af 2>&1 || true
              docker builder prune -af 2>&1 || true
              echo "Done."
              exit 0
            fi

            echo "Deployment FAILED - health check timeout"
            umask 077
            LOG_FILE="$DEPLOY_DIR/deploy-failure-$(date +%Y%m%dT%H%M%S).log"
            docker compose -f "$COMPOSE_FILE" logs --tail=200 > "$LOG_FILE" 2>&1 || true
            echo "Container logs were retained on the VM at $LOG_FILE"

            echo "Rolling back to the previous image..."
            if docker image inspect "$ROLLBACK_TAG" >/dev/null 2>&1; then
              docker tag "$ROLLBACK_TAG" "$LATEST_TAG"
              docker compose -f "$COMPOSE_FILE" up -d --force-recreate
              ROLLBACK_HEALTHY=0
              for i in {1..12}; do
                sleep 5
                if wget -q --spider http://127.0.0.1:3000/api/health 2>/dev/null; then
                  ROLLBACK_HEALTHY=1
                  break
                fi
                echo "  Rollback health attempt $i/12..."
              done
              if [ "$ROLLBACK_HEALTHY" -eq 1 ]; then
                echo "Rollback health check passed."
              else
                echo "Rollback health check FAILED; manual recovery required."
              fi
            else
              echo "No rollback image available (first deploy); service left on the failed image."
            fi
            exit 1
          DEPLOY_SCRIPT

      - name: Cleanup SSH
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
            "docker logout ghcr.io >/dev/null 2>&1 || true" || true
          rm -f ~/.ssh/deploy_key
